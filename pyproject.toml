# make `astdocs` installable (via `pip install git+https://...`)

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "astdocs"
version = "0.0.1"
description = "Opinionated way to pull and format NumPy-ish docstrings from Python modules."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "carnarez" }]
urls = { Homepage = "https://github.com/carnarez/astdocs" }

[project.scripts]
astdocs = "astdocs.astdocs:cli"

[tool.setuptools]
packages = ["astdocs"]
package-data = { astdocs = ["py.typed"] }

[tool.ruff]
# the Markdown files are generated by astdocs itself
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",  # AST nodes of any type are passed around on purpose
  "COM812",  # conflicts with the formatter
  "CPY001",
  "D203",    # incompatible with D211
  "D213",    # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
